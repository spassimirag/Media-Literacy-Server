plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spassimirag'
version = '0.0.1-SNAPSHOT'
description = 'media-literacy-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }

}

sourceSets {
    eval {
        // eval code can use the server's classes (e.g. reuse its HTTP setup later)
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        // eval code is unit-tested alongside the server, so CI covers it too
        compileClasspath += sourceSets.eval.output
        runtimeClasspath += sourceSets.eval.output
    }
}

configurations {
    // eval code gets the same libraries as the main code
    evalImplementation.extendsFrom implementation
    evalRuntimeOnly.extendsFrom runtimeOnly
    // tests of eval code need the eval libraries too (e.g. commons-csv)
    testImplementation.extendsFrom evalImplementation
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M6')

    // Swap for spring-ai-starter-mcp-server-webmvc later if you deploy remotely over HTTP.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server'
    // Jackson for building/parsing the Anthropic API JSON (version managed by the Spring Boot BOM).
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // jsoup for stripping fetched articles down to readable text.
    implementation 'org.jsoup:jsoup:1.18.3'
    evalImplementation 'org.apache.commons:commons-csv:1.14.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runEval', JavaExec) {
    group = 'verification'
    description = 'Runs the framing judge evaluation'
    classpath = sourceSets.eval.runtimeClasspath
    mainClass = 'com.spassimirag.medialiteracyserver.eval.EvalRunner'
    workingDir = rootDir
}

tasks.register('agreement', JavaExec) {
    group = 'verification'
    description = 'Compares the saved judge labels with the human labels (no API calls)'
    classpath = sourceSets.eval.runtimeClasspath
    mainClass = 'com.spassimirag.medialiteracyserver.eval.AgreementReport'
    workingDir = rootDir
}
