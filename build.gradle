plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spassimirag'
version = '0.0.1-SNAPSHOT'
description = 'media-literacy-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }

}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M6')

    // Swap for spring-ai-starter-mcp-server-webmvc later if you deploy remotely over HTTP.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server'
    // Jackson for building/parsing the Anthropic API JSON (version managed by the Spring Boot BOM).
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // jsoup for stripping fetched articles down to readable text.
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
